<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2418" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Overplanner</title>
    <script>
      // Apply the cached theme, colours and font before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("overplanner-theme") || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        ["overplanner-palette", "overplanner-font"].forEach(function (key) {
          var vars = JSON.parse(localStorage.getItem(key) || "null");
          for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
