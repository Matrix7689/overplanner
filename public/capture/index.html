<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2418" />
    <title>Capture</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #e8decf;
        --card: #faf5ee;
        --text: #1a120e;
        --muted: #4a4a46;
        --line: #d5c4ae;
        --accent: #6b4a2e;
        --on-accent: #faf5ee;
        --ok: #255a33;
        --warn: #6b4600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a120e;
          --card: #3a2418;
          --text: #f0e7da;
          --muted: #c6b49d;
          --line: #6b4a2e;
          --accent: #d5c4ae;
          --on-accent: #1a120e;
          --ok: #9fd3a3;
          --warn: #eec16a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
      textarea {
        display: block;
        width: 100%;
        min-height: 96px;
        max-height: 50vh;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        font: inherit;
        resize: none;
        outline: none;
      }
      textarea:focus { border-color: var(--muted); }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .toggle { display: flex; flex: 1; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      .toggle button {
        flex: 1;
        padding: 9px 0;
        border: 0;
        border-radius: 9px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
      }
      .toggle button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
      #add {
        flex: 1;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
      }
      #add:disabled { opacity: 0.4; }
      .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; min-height: 32px; }
      #status { margin: 0; font-size: 14px; color: var(--muted); }
      #status[data-state="ok"] { color: var(--ok); }
      #status[data-state="off"] { color: var(--warn); }
      #send {
        flex-shrink: 0;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--card);
        color: inherit;
        font: inherit;
        font-size: 14px;
      }
      #queue { margin: 8px 0 0; padding: 0; list-style: none; }
      #queue li {
        position: relative;
        padding: 10px 36px 10px 12px;
        margin-top: 6px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      #queue span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
      #queue small { display: block; margin-top: 4px; color: var(--warn); }
      #queue button {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 32px;
        height: 32px;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Capture</h1>
      <form id="form">
        <textarea id="text" placeholder="Add a task, note or link…" aria-label="What to capture" autofocus></textarea>
        <div class="row">
          <div class="toggle" role="radiogroup" aria-label="Type">
            <button type="button" role="radio" data-mode="task" aria-checked="true">Task</button>
            <button type="button" role="radio" data-mode="note" aria-checked="false">Note</button>
          </div>
          <button id="add" type="submit" disabled>Add</button>
        </div>
      </form>
      <div class="status-row">
        <p id="status" role="status"></p>
        <button id="send" type="button" hidden>Send now</button>
      </div>
      <ul id="queue"></ul>
    </main>
    <script src="./queue.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
